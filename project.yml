name: WatchHook
options:
  bundleIdPrefix: com.nabettu
  developmentLanguage: ja
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
settings:
  base:
    DEVELOPMENT_TEAM: 2KDR72P2RA
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # String Catalog (Localizable.xcstrings) に、Text 以外 (Label・Button・String(localized:) など) の文言もコンパイラから書き出す
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  WatchHookCore:
    path: Packages/WatchHookCore
targets:
  WatchHook:
    type: application
    platform: iOS
    sources:
      - WatchHook
      - Shared
    dependencies:
      - package: WatchHookCore
      - target: WatchHookWatch
    info:
      path: WatchHook/Info.plist
      properties:
        CFBundleDisplayName: Hayate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        INAlternativeAppNames:
          - INAlternativeAppName: はやて
            INAlternativeAppNamePronunciationHint: はやて
        UILaunchScreen:
          UIColorName: LaunchBackground
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # 合図の言葉で始めたメモをリマインダーに追加する (同じメモを二重に足さないよう、既存の項目を読む)
        NSRemindersFullAccessUsageDescription: 合図の言葉で始めたメモを、選んだリストにリマインダーとして追加します。
        # リマインダーの URL 欄 (hayate://memo/<id>) からメモを開く
        CFBundleURLTypes:
          - CFBundleURLName: com.nabettu.watchhook
            CFBundleURLSchemes: [hayate]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nabettu.watchhook
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  WatchHookWatch:
    type: application
    platform: watchOS
    sources:
      - WatchHookWatch
      - path: Shared
      # デバッグ用のウィジェットの見本 (WidgetGalleryView) で使う
      - path: WatchHookWidget/LauncherViews.swift
    dependencies:
      - package: WatchHookCore
      - target: WatchHookWidget
    info:
      path: WatchHookWatch/Info.plist
      properties:
        CFBundleDisplayName: Hayate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        INAlternativeAppNames:
          - INAlternativeAppName: はやて
            INAlternativeAppNamePronunciationHint: はやて
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.nabettu.watchhook
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nabettu.watchhook.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  WatchHookWidget:
    type: app-extension
    platform: watchOS
    sources:
      - WatchHookWidget
      # 色・紙飛行機・星の形 (WatchHookCore に頼らない部分だけ)
      - path: Shared/CosmosArt.swift
    info:
      path: WatchHookWidget/Info.plist
      properties:
        CFBundleDisplayName: Hayate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nabettu.watchhook.watchkitapp.widget
        SKIP_INSTALL: YES
schemes:
  WatchHook:
    build:
      targets:
        WatchHook: all
        WatchHookWatch: all
