<!-- WatchHook のアプリアイコン (iPhone / Watch 共通)。変えたら scripts/render-app-icon.sh で AppIcon.png を作り直す -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1026"/>
      <stop offset="1" stop-color="#2E1065"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- 星: 機体から離して置く (Watch の丸型で切れる角にも寄せすぎない) -->
  <path d="M210 160 Q220 210 270 220 Q220 230 210 280 Q200 230 150 220 Q200 210 210 160Z" fill="#FDE68A"/>
  <g fill="#fff" opacity=".9">
    <circle cx="360" cy="130" r="7"/>
    <circle cx="120" cy="380" r="6"/>
    <circle cx="210" cy="820" r="9"/>
    <circle cx="880" cy="900" r="8"/>
    <circle cx="900" cy="560" r="6"/>
  </g>
  <!-- 紙飛行機: 奥の翼 / 竜骨 / 手前の翼 / 折り目 (機首 850,200 → 胴の折り目 470,600 が中心線) -->
  <g stroke-linejoin="round">
    <path d="M850 200 L560 800 L470 600 Z" fill="#C4B5FD" stroke="#C4B5FD" stroke-width="16"/>
    <path d="M850 200 L470 600 L400 720 Z" fill="#8B5CF6" stroke="#8B5CF6" stroke-width="16"/>
    <path d="M850 200 L170 470 L470 600 Z" fill="#fff" stroke="#fff" stroke-width="16"/>
    <path d="M850 200 L470 600 L520 560 Z" fill="#EDE9FE" stroke="#EDE9FE" stroke-width="8"/>
  </g>
</svg>
